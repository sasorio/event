name: "Build"

on:
  pull_request:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  release:
    types:
      - released

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: "${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}"
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "git / checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "java / setup"
        uses: "actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287" # v5.3.0
        with:
          check-latest: true
          distribution: "zulu"
          java-version: "17"

      - name: "gradle / setup"
        uses: "gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92" # v6.2.0

      - name: "gradle / build"
        run: "./gradlew build"

      - name: "gradle / resolve metadata"
        if: "${{ runner.os == 'Linux' }}"
        run: |
          if [ "$(./gradlew properties | awk '/^version:/ { print $2; }' | grep '\-SNAPSHOT')" ]; then
            echo "VERSION_TYPE=SNAPSHOT" >> $GITHUB_ENV
          else
            echo "VERSION_TYPE=RELEASE" >> $GITHUB_ENV
          fi

      - name: "gradle / publish snapshot"
        if: "${{ runner.os == 'Linux' && env.VERSION_TYPE == 'SNAPSHOT' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        run: "./gradlew publish"
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: "${{ secrets.SONATYPE_USERNAME }}"
          ORG_GRADLE_PROJECT_sonatypePassword: "${{ secrets.SONATYPE_PASSWORD }}"

      - name: "gradle / publish release"
        if: "${{ runner.os == 'Linux' && env.VERSION_TYPE == 'RELEASE' && github.event_name == 'release' }}"
        run: "./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository"
        env:
          ORG_GRADLE_PROJECT_signingKey: "${{ secrets.SONATYPE_SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_signingPassword: "${{ secrets.SONATYPE_SIGNING_PASSWORD }}"
          ORG_GRADLE_PROJECT_sonatypeUsername: "${{ secrets.SONATYPE_USERNAME }}"
          ORG_GRADLE_PROJECT_sonatypePassword: "${{ secrets.SONATYPE_PASSWORD }}"
